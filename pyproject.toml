[project]
name = "prism-vggt"
version = "0.1.0"
description = "Training-Free Streaming 3D Reconstruction from Panoramic Video using PanoVGGT and Nvblox"
readme = "README.md"
requires-python = "==3.11.*"

# --- CORE LIBRARY DEPENDENCIES ---
dependencies = [
    "torch==2.4.*",
    "torchvision>=0.19.0",
    "torchaudio>=2.4.0",
    "xformers>=0.0.27.post2",
    # Math & Arrays
    "numpy==1.26.4",
    "scipy",
    "pandas",
    # Core Geometry & Model Processing
    "open3d",
    "trimesh",
    "plyfile",
    "pypose",
    "kornia",
    # Model Architecture Utils
    "einops",
    "huggingface-hub",
    "safetensors",
    # System & Configuration
    "hydra-core",
    "omegaconf",
    "yacs",
    "colorlog",
    "tqdm",
    "cython",
    "numba",
    "nvblox-torch @ https://github.com/zRafaF/nvblox/releases/download/v0.0.10/nvblox_torch-0.0.10.dev1+cuubuntu22-py3-none-linux_x86_64.whl ; sys_platform == 'linux'",
]

# --- OPTIONAL EXTENSIONS ---
[project.optional-dependencies]
apps = [
    "gradio>=6.17.3",
    "fastapi>=0.136.3",
    "flask==3.1.2",
    "plotly>=6.7.0",
    "opencv-python",
    "pillow",
    "imageio",
    "scikit-image",
]

benchmarks = [
    "evo",
    "scikit-learn",
    "tensorboard",
]

# --- BUILD SYSTEM ---
[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

# --- UV SPECIFIC CONFIGURATION (CUDA 12.4 HARD-LOCK) ---
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
xformers = { index = "pytorch-cu124" }

# Inject PyTorch into the isolated build environment to prevent source-compilation crashes
[tool.uv.extra-build-dependencies]
xformers = ["torch>=2.4.0"]
prism-vggt = ["Cython", "numpy"]

[tool.setuptools.packages.find]
include = ["prism_vggt*"]